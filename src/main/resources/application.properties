spring.application.name=recommend
spring.datasource.url=jdbc:mysql://localhost:3306/myproject?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Profile storage; set an absolute persistent directory in production.
app.upload-dir=${PROFILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Shared phone verification is opt-in; memory is for single-process development only.
app.phone.store=${PHONE_VERIFICATION_STORE:memory}
app.phone.redis-prefix=${PHONE_VERIFICATION_REDIS_PREFIX:recommend:phone:v1}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Phase 1: server-only AI settings. Never put a real key in this file.
app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${AI_MODEL:}
app.ai.max-input-chars=${AI_MAX_INPUT_CHARS:2000}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:800}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:20}
app.ai.max-concurrent=${AI_MAX_CONCURRENT:4}
app.ai.requests-per-minute=${AI_REQUESTS_PER_MINUTE:6}
app.ai.global-requests-per-minute=${AI_GLOBAL_REQUESTS_PER_MINUTE:60}
